# squid 主套件流水线（opt-in）
#
# 等价于 .github/workflows/test-squid.yaml 中 gy-006 环境能跑的那几个 job：
#   function     —— 代理/CONNECT/MITM、MISS→HIT、完整性、失败面
#   concurrency  —— 同对象阶梯并发、异对象并发、混合工具并行
#   cabundle     —— no_proxy 直连 × CA 注入矩阵
# 其余 job（tools / vllm / imagebuild / parity / gitcode / pkg）依赖 pip/npm/go/
# buildctl/镜像内重写规则或 gitcode 后端，当前环境不具备，故不在此跑。
#
# 代理由部署仓 other/ascend-gha-runners/vllm-omni/linux-aarch64-a2b3-gy006
# 通过 pod-spec-patch 注入（HTTP(S)_PROXY / NO_PROXY / CA bundle），脚本内
# 不配置任何代理——流量必须来自环境注入，这是被测对象本身。
#
# 两条 step 做 A/B：
#   1) 不指定 image → container-0 用 agent 默认镜像（Alpine，busybox wget，
#      busybox wget 经 squid 必报 "Resource temporarily unavailable"，已知实现缺陷）
#   2) 指定真实镜像 → Ubuntu 基底 + GNU wget，等于上游 vllm-omni NPU CI 的镜像面
steps:
  - label: ":squid: 套件 · runner 镜像（alpine）"
    agents:
      queue: "linux-aarch64-a2b3-gy006-test"
    commands:
      - bash .buildkite/scripts/run_squid_suite.sh function concurrency cabundle
    timeout_in_minutes: 60

  - label: ":squid: 套件 · 真实镜像（vllm-ascend a3）"
    agents:
      queue: "linux-aarch64-a2b3-gy006-test"
    # 与 docker/Dockerfile.npu.a3 的 VLLM_ASCEND_TAG 一致；取 cn-southwest-2
    # （gy-006 同 region）镜像，避免跨区拉反而比走 squid 更慢。
    image: "swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:v0.17.0rc1-a3"
    commands:
      - bash .buildkite/scripts/run_squid_suite.sh function concurrency cabundle
    timeout_in_minutes: 90
